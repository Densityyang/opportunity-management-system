name: opportunity-management-system

services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [oms]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@oms/api", "prisma:deploy"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [oms]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@oms/api", "start:prod"]
    env_file: .env
    volumes:
      - audio_data:/data/audio
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [oms]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@oms/api", "start:worker"]
    env_file: .env
    volumes:
      - audio_data:/data/audio
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [oms]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${OMS_BIND_ADDRESS:-127.0.0.1}:${OMS_HTTP_PORT:-18280}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [oms]

volumes:
  postgres_data:
  audio_data:

networks:
  oms:
    driver: bridge
