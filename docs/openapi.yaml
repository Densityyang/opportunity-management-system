openapi: 3.1.0
info:
  title: 商机随手报 API
  version: 1.0.0
  description: 固定问卷、区县承接、分侧处理、双节点审核与市公司成功商机库。
servers:
  - url: /api/v1
security:
  - cookieAuth: []
    roleGrant: []
paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200": { description: healthy }
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "201":
          description: logged in
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CurrentUser" } },
            }
        default: { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      security: [{ cookieAuth: [] }]
      operationId: currentUser
      responses:
        "200":
          {
            description: current user,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CurrentUser" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /auth/change-password:
    post:
      security: [{ cookieAuth: [] }]
      operationId: changePassword
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/ChangePasswordRequest" },
                },
            },
        }
      responses:
        "201": { description: changed }
        default: { $ref: "#/components/responses/Problem" }
  /auth/reauth:
    post:
      operationId: reauthenticateForExport
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ReauthRequest" } },
            },
        }
      responses:
        "201":
          {
            description: one-time token,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        additionalProperties: false,
                        required: [token, expiresAt],
                        properties:
                          {
                            token: { type: string },
                            expiresAt: { type: string, format: date-time },
                          },
                      },
                  },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      security: [{ cookieAuth: [] }]
      operationId: logout
      responses:
        "201": { description: logged out }
  /reference/districts:
    get:
      operationId: listEnabledDistricts
      responses:
        "200":
          {
            description: districts,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/District" },
                      },
                  },
              },
          }
  /reference/handlers:
    get:
      operationId: listAssignableHandlers
      parameters:
        - {
            in: query,
            name: districtId,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: customerType,
            required: true,
            schema: { $ref: "#/components/schemas/CustomerType" },
          }
      responses:
        "200": { description: handlers }
        default: { $ref: "#/components/responses/Problem" }
  /opportunities:
    post:
      operationId: submitOpportunity
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/SubmitOpportunityRequest" },
                },
            },
        }
      responses:
        "201":
          {
            description: submitted,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/OpportunityDetail" },
                  },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: listOpportunities
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - {
            in: query,
            name: state,
            schema: { $ref: "#/components/schemas/OpportunityState" },
          }
        - {
            in: query,
            name: districtId,
            schema: { type: string, format: uuid },
          }
      responses:
        "200": { description: role-scoped list }
        default: { $ref: "#/components/responses/Problem" }
  /opportunities/{opportunityId}:
    parameters: [{ $ref: "#/components/parameters/OpportunityId" }]
    get:
      operationId: getOpportunity
      responses:
        "200":
          {
            description: detail,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/OpportunityDetail" },
                  },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /opportunities/{opportunityId}/timeline:
    parameters: [{ $ref: "#/components/parameters/OpportunityId" }]
    get:
      operationId: getTimeline
      responses:
        "200": { description: append-only workflow events }
        default: { $ref: "#/components/responses/Problem" }
  /opportunities/{opportunityId}/resubmit:
    parameters: [{ $ref: "#/components/parameters/OpportunityId" }]
    put:
      operationId: resubmitOpportunity
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/ResubmitOpportunityRequest" },
                },
            },
        }
      responses:
        "200": { description: resubmitted }
        default: { $ref: "#/components/responses/Problem" }
  /opportunities/{opportunityId}/audio:
    parameters: [{ $ref: "#/components/parameters/OpportunityId" }]
    post:
      operationId: uploadAudio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [audio]
              properties: { audio: { type: string, format: binary } }
      responses:
        "201": { description: encrypted audio stored }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: playAudio
      responses:
        "200":
          {
            description: decrypted authorized stream,
            content:
              {
                audio/webm: { schema: { type: string, format: binary } },
                audio/mp4: { schema: { type: string, format: binary } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAudioBeforeReview
      responses:
        "200": { description: reporter removed audio while editable }
        default: { $ref: "#/components/responses/Problem" }
  /opportunities/{opportunityId}/reviews/first/approve:
    post:
      operationId: approveFirstReview
      parameters:
        [
          { $ref: "#/components/parameters/OpportunityId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/FirstApproveRequest" },
                },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Transitioned" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /opportunities/{opportunityId}/reviews/first/return:
    post:
      operationId: returnFirstReview
      parameters:
        [
          { $ref: "#/components/parameters/OpportunityId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ReturnRequest" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Transitioned" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /opportunities/{opportunityId}/assignments/reassign:
    post:
      operationId: reassignOpportunity
      parameters:
        [
          { $ref: "#/components/parameters/OpportunityId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ReassignRequest" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Transitioned" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /opportunities/{opportunityId}/pause:
    post:
      operationId: pauseOpportunity
      parameters:
        [
          { $ref: "#/components/parameters/OpportunityId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/PauseRequest" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Transitioned" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /opportunities/{opportunityId}/resume:
    post:
      operationId: resumeOpportunity
      parameters:
        [
          { $ref: "#/components/parameters/OpportunityId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/VersionRequest" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Transitioned" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /opportunities/{opportunityId}/results/success:
    post:
      operationId: submitSuccessResult
      description: 成功结果仅允许成功商机名称，不接受金额、产品、日期或其他扩展字段。
      parameters:
        [
          { $ref: "#/components/parameters/OpportunityId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/SuccessResultRequest" },
                },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Transitioned" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /opportunities/{opportunityId}/results/failure:
    post:
      operationId: submitFailureResult
      parameters:
        [
          { $ref: "#/components/parameters/OpportunityId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/FailureResultRequest" },
                },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Transitioned" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /opportunities/{opportunityId}/reviews/final/approve:
    post:
      operationId: approveFinalReview
      parameters:
        [
          { $ref: "#/components/parameters/OpportunityId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/VersionRequest" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Transitioned" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /opportunities/{opportunityId}/reviews/final/return:
    post:
      operationId: returnFinalReview
      parameters:
        [
          { $ref: "#/components/parameters/OpportunityId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ReturnRequest" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Transitioned" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /notifications:
    get:
      operationId: listNotifications
      responses:
        {
          "200": { description: current role and user notifications },
          default: { $ref: "#/components/responses/Problem" },
        }
  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      responses:
        {
          "200": { description: marked },
          default: { $ref: "#/components/responses/Problem" },
        }
  /municipal/successes:
    get:
      operationId: listMunicipalSuccesses
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - {
            in: query,
            name: districtId,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: customerType,
            schema: { $ref: "#/components/schemas/CustomerType" },
          }
        - {
            in: query,
            name: attitude,
            schema: { $ref: "#/components/schemas/CustomerAttitude" },
          }
        - {
            in: query,
            name: successOpportunityName,
            schema: { type: string, minLength: 2, maxLength: 100 },
          }
        - {
            in: query,
            name: customerContact,
            schema: { type: string, maxLength: 200 },
          }
        - {
            in: query,
            name: closedFrom,
            schema: { type: string, format: date-time },
          }
        - {
            in: query,
            name: closedTo,
            schema: { type: string, format: date-time },
          }
      responses:
        {
          "200": { description: successful opportunities },
          default: { $ref: "#/components/responses/Problem" },
        }
  /municipal/successes/{opportunityId}:
    get:
      operationId: getMunicipalSuccess
      parameters: [{ $ref: "#/components/parameters/OpportunityId" }]
      responses:
        {
          "200": { description: read-only detail and timeline },
          default: { $ref: "#/components/responses/Problem" },
        }
  /municipal/exports/successes:
    post:
      operationId: exportSuccesses
      parameters: [{ $ref: "#/components/parameters/ReauthToken" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/SuccessExportFilter" },
                },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Xlsx" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /municipal/exports/workflow:
    post:
      operationId: exportWorkflowNodes
      parameters: [{ $ref: "#/components/parameters/ReauthToken" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/WorkflowExportFilter" },
                },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Xlsx" },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/capabilities:
    get:
      operationId: getAdminCapabilities
      responses:
        {
          "200":
            {
              description: capabilities resolved from the active role grant,
              content:
                {
                  application/json:
                    {
                      schema:
                        { $ref: "#/components/schemas/AdminCapabilities" },
                    },
                },
            },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/users:
    get:
      operationId: listUsers
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { in: query, name: search, schema: { type: string, maxLength: 80 } }
        - {
            in: query,
            name: role,
            schema: { $ref: "#/components/schemas/RoleCode" },
          }
        - {
            in: query,
            name: districtId,
            schema: { type: string, format: uuid },
          }
        - { in: query, name: active, schema: { type: boolean } }
      responses:
        {
          "200": { description: accounts and grants },
          default: { $ref: "#/components/responses/Problem" },
        }
    post:
      operationId: createUser
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreateUserRequest" } },
            },
        }
      responses:
        {
          "201": { description: created },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/users/{userId}:
    patch:
      operationId: updateUser
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/UpdateUserRequest" } },
            },
        }
      responses:
        {
          "200": { description: updated },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/users/{userId}/reset-password:
    post:
      operationId: resetUserPassword
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ResetPasswordRequest" },
                },
            },
        }
      responses:
        {
          "201": { description: password reset and active sessions revoked },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/users/{userId}/grants:
    post:
      operationId: createRoleGrant
      parameters:
        [
          {
            in: path,
            name: userId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/CreateRoleGrantRequest" },
                },
            },
        }
      responses:
        {
          "201": { description: created },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/grants/{grantId}:
    delete:
      operationId: deactivateRoleGrant
      parameters: [{ $ref: "#/components/parameters/GrantId" }]
      responses:
        {
          "200": { description: grant deactivated },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/districts:
    get:
      operationId: listAdminDistrictCoverage
      responses:
        {
          "200":
            {
              description: districts in the active administration scope with role-derived coverage,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/AdminDistrict" },
                        },
                    },
                },
            },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/districts/{districtId}:
    patch:
      operationId: updateDistrict
      parameters: [{ $ref: "#/components/parameters/DistrictId" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/UpdateDistrictRequest" },
                },
            },
        }
      responses:
        {
          "200": { description: district updated },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/retention/{candidateId}/complete:
    post:
      operationId: completeRetention
      parameters:
        [
          {
            in: path,
            name: candidateId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RetentionRequest" } },
            },
        }
      responses:
        {
          "201": { description: completed },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/personnel:
    get:
      operationId: listPersonnel
      parameters:
        [
          { $ref: "#/components/parameters/Page" },
          {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          },
          { in: query, name: search, schema: { type: string, maxLength: 120 } },
          { in: query, name: active, schema: { type: boolean } },
        ]
      responses:
        {
          "200":
            {
              description: personnel page,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/PersonnelPage" } },
                },
            },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/personnel/import:
    post:
      operationId: importPersonnel
      requestBody:
        {
          required: true,
          content:
            {
              multipart/form-data:
                {
                  schema:
                    { $ref: "#/components/schemas/PersonnelImportRequest" },
                },
            },
        }
      responses:
        {
          "201":
            {
              description: import result,
              content:
                {
                  application/json:
                    {
                      schema: { $ref: "#/components/schemas/PersonnelImport" },
                    },
                },
            },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/personnel/imports:
    get:
      operationId: listPersonnelImports
      responses:
        {
          "200":
            {
              description: recent import records,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: array,
                          items:
                            { $ref: "#/components/schemas/PersonnelImport" },
                        },
                    },
                },
            },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/personnel/{personnelId}/account:
    post:
      operationId: createPersonnelAccount
      parameters:
        [
          {
            in: path,
            name: personnelId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PersonnelAccountRequest" },
                },
            },
        }
      responses:
        {
          "201": { description: account created or linked },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/personnel-positions:
    get:
      operationId: listPersonnelPositions
      responses:
        {
          "200":
            {
              description: configured positions,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: array,
                          items:
                            { $ref: "#/components/schemas/PersonnelPosition" },
                        },
                    },
                },
            },
          default: { $ref: "#/components/responses/Problem" },
        }
    post:
      operationId: createPersonnelPosition
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PersonnelPositionRequest" },
                },
            },
        }
      responses:
        {
          "201": { description: position created },
          default: { $ref: "#/components/responses/Problem" },
        }
  /admin/personnel-positions/{positionId}:
    patch:
      operationId: updatePersonnelPosition
      parameters:
        [
          {
            in: path,
            name: positionId,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/PersonnelPositionUpdateRequest",
                    },
                },
            },
        }
      responses:
        {
          "200": { description: position updated },
          default: { $ref: "#/components/responses/Problem" },
        }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: oms_session }
    roleGrant: { type: apiKey, in: header, name: X-Role-Grant-Id }
  parameters:
    OpportunityId:
      {
        in: path,
        name: opportunityId,
        required: true,
        schema: { type: string, format: uuid },
      }
    UserId:
      {
        in: path,
        name: userId,
        required: true,
        schema: { type: string, format: uuid },
      }
    GrantId:
      {
        in: path,
        name: grantId,
        required: true,
        schema: { type: string, format: uuid },
      }
    DistrictId:
      {
        in: path,
        name: districtId,
        required: true,
        schema: { type: string, format: uuid },
      }
    IdempotencyKey:
      {
        in: header,
        name: Idempotency-Key,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 160 },
      }
    ReauthToken:
      {
        in: header,
        name: X-Reauth-Token,
        required: true,
        schema: { type: string },
      }
    Page:
      {
        in: query,
        name: page,
        schema: { type: integer, minimum: 1, default: 1 },
      }
    PageSize:
      {
        in: query,
        name: pageSize,
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
      }
  responses:
    Problem:
      description: problem details
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/ProblemDetails" } },
        }
    Transitioned:
      description: state transitioned
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/TransitionResult" } },
        }
    Xlsx:
      description: streamed XLSX without server-side retained copy
      content:
        {
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            { schema: { type: string, format: binary } },
        }
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        {
          phone: { type: string, pattern: '^1[3-9]\d{9}$' },
          password: { type: string, minLength: 6, maxLength: 12 },
        }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        {
          currentPassword: { type: string, minLength: 6, maxLength: 12 },
          newPassword: { type: string, minLength: 6, maxLength: 12 },
        }
    ReauthRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties: { password: { type: string, minLength: 6, maxLength: 12 } }
    RoleCode:
      {
        type: string,
        enum:
          [
            FIELD_REPORTER,
            DISTRICT_MANAGER,
            PERSONAL_HANDLER,
            ORGANIZATION_HANDLER,
            MUNICIPAL,
            SENIOR_MUNICIPAL_ADMIN,
            SYSTEM_ADMIN,
          ],
      }
    CustomerType: { type: string, enum: [PERSONAL, ORGANIZATION] }
    CustomerAttitude:
      { type: string, enum: [URGENT, IMPORTANT, GENERAL, POTENTIAL] }
    SpecificNeedOption:
      {
        type: string,
        enum:
          [
            想新装、升级宽带或专线,
            家里、商铺或办公室网络不好,
            想装监控、安防、门禁或考勤,
            想了解全屋智能、智能家庭,
            需要办公网络、园区网络或Wi-Fi建设,
            需要云服务、网络安全、算力或AI应用,
            需要通信工程、线路迁改或机房建设,
            客户准备装修、搬家、开店或搬办公室,
            不清楚具体产品，客户希望专业人员看看,
            其他需求,
          ],
      }
    OpportunityState:
      {
        type: string,
        enum:
          [
            PENDING_FIRST_REVIEW,
            RETURNED_TO_REPORTER,
            HANDLING,
            PAUSED,
            PENDING_FINAL_REVIEW,
            RETURNED_TO_HANDLER,
            CLOSED_SUCCESS,
            CLOSED_FAILURE,
          ],
      }
    District:
      type: object
      additionalProperties: false
      required: [id, code, name, enabled, sortOrder]
      properties:
        {
          id: { type: string, format: uuid },
          code: { type: string },
          name: { type: string },
          enabled: { type: boolean },
          sortOrder: { type: integer },
        }
    AdminDistrict:
      allOf:
        - { $ref: "#/components/schemas/District" }
        - type: object
          required: [coverage]
          properties:
            coverage:
              type: object
              additionalProperties: false
              required:
                [
                  fieldReporters,
                  managers,
                  personalHandlers,
                  organizationHandlers,
                ]
              properties:
                fieldReporters: { type: integer, minimum: 0 }
                managers: { type: integer, minimum: 0 }
                personalHandlers: { type: integer, minimum: 0 }
                organizationHandlers: { type: integer, minimum: 0 }
    AdminCapabilities:
      type: object
      additionalProperties: false
      required:
        [
          activeRole,
          districtId,
          manageableRoles,
          canManageGlobalUsers,
          canManageDistricts,
          canViewPersonnel,
          canImportPersonnel,
          canManagePositions,
          canManageRetention,
          canViewMunicipal,
        ]
      properties:
        activeRole:
          {
            type: string,
            enum: [SYSTEM_ADMIN, SENIOR_MUNICIPAL_ADMIN, DISTRICT_MANAGER],
          }
        districtId: { type: [string, "null"], format: uuid }
        manageableRoles:
          {
            type: array,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/RoleCode" },
          }
        canManageGlobalUsers: { type: boolean }
        canManageDistricts: { type: boolean }
        canViewPersonnel: { type: boolean }
        canImportPersonnel: { type: boolean }
        canManagePositions: { type: boolean }
        canManageRetention: { type: boolean }
        canViewMunicipal: { type: boolean }
    RoleGrant:
      type: object
      additionalProperties: false
      required: [id, role, districtId, districtName]
      properties:
        {
          id: { type: string, format: uuid },
          role: { $ref: "#/components/schemas/RoleCode" },
          districtId: { type: [string, "null"], format: uuid },
          districtName: { type: [string, "null"] },
        }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, phone, displayName, mustChangePassword, grants]
      properties:
        {
          id: { type: string, format: uuid },
          phone: { type: string },
          displayName: { type: string },
          mustChangePassword: { type: boolean },
          grants:
            { type: array, items: { $ref: "#/components/schemas/RoleGrant" } },
        }
    SubmitOpportunityRequest:
      type: object
      additionalProperties: false
      required:
        [
          customerType,
          districtId,
          customerContact,
          specificNeeds,
          attitude,
          consentConfirmed,
        ]
      properties:
        customerType: { $ref: "#/components/schemas/CustomerType" }
        districtId: { type: string, format: uuid }
        customerContact: { type: string, minLength: 1, maxLength: 200 }
        specificNeeds:
          {
            type: array,
            minItems: 1,
            maxItems: 2,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/SpecificNeedOption" },
          }
        attitude: { $ref: "#/components/schemas/CustomerAttitude" }
        oneSentenceDescription: { type: string, maxLength: 50 }
        consentConfirmed: { type: boolean, const: true }
    ResubmitOpportunityRequest:
      type: object
      additionalProperties: false
      required:
        [
          expectedVersion,
          customerType,
          districtId,
          customerContact,
          specificNeeds,
          attitude,
          consentConfirmed,
        ]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        customerType: { $ref: "#/components/schemas/CustomerType" }
        districtId: { type: string, format: uuid }
        customerContact: { type: string, minLength: 1, maxLength: 200 }
        specificNeeds:
          {
            type: array,
            minItems: 1,
            maxItems: 2,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/SpecificNeedOption" },
          }
        attitude: { $ref: "#/components/schemas/CustomerAttitude" }
        oneSentenceDescription: { type: string, maxLength: 50 }
        consentConfirmed: { type: boolean, const: true }
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties: { expectedVersion: { type: integer, minimum: 1 } }
    FirstApproveRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, handlerGrantId]
      properties:
        {
          expectedVersion: { type: integer, minimum: 1 },
          handlerGrantId: { type: string, format: uuid },
        }
    ReturnRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        {
          expectedVersion: { type: integer, minimum: 1 },
          reason: { type: string, minLength: 1, maxLength: 500 },
        }
    ReassignRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, handlerGrantId, reason]
      properties:
        {
          expectedVersion: { type: integer, minimum: 1 },
          handlerGrantId: { type: string, format: uuid },
          reason: { type: string, minLength: 1, maxLength: 500 },
        }
    PauseRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, nextProcessingAt]
      properties:
        {
          expectedVersion: { type: integer, minimum: 1 },
          nextProcessingAt: { type: string, format: date-time },
        }
    SuccessResultRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, successOpportunityName]
      properties:
        {
          expectedVersion: { type: integer, minimum: 1 },
          successOpportunityName:
            {
              type: string,
              minLength: 1,
              maxLength: 200,
              description: 请填写公司DICT系统项目名称,
            },
        }
    FailureResultRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, failureReason]
      properties:
        {
          expectedVersion: { type: integer, minimum: 1 },
          failureReason: { type: string, minLength: 1, maxLength: 500 },
        }
    TransitionResult:
      type: object
      additionalProperties: false
      required: [id, state, version]
      properties:
        {
          id: { type: string, format: uuid },
          state: { $ref: "#/components/schemas/OpportunityState" },
          version: { type: integer },
        }
    OpportunityDetail:
      type: object
      description: 字段以服务端记录级授权裁剪；市公司仅成功终态可获得。
      required:
        [
          id,
          serialNumber,
          state,
          version,
          reporterPhone,
          customerType,
          district,
          customerContact,
          specificNeeds,
          specificNeed,
          attitude,
          consentAt,
        ]
      properties:
        id: { type: string, format: uuid }
        serialNumber: { type: string }
        state: { $ref: "#/components/schemas/OpportunityState" }
        version: { type: integer }
        reporterPhone: { type: string }
        customerType: { $ref: "#/components/schemas/CustomerType" }
        district: { $ref: "#/components/schemas/District" }
        customerContact: { type: string }
        specificNeed: { type: string }
        specificNeeds:
          {
            type: array,
            minItems: 1,
            maxItems: 2,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/SpecificNeedOption" },
          }
        attitude: { $ref: "#/components/schemas/CustomerAttitude" }
        oneSentenceDescription: { type: [string, "null"] }
        successOpportunityName: { type: [string, "null"] }
        failureReason: { type: [string, "null"] }
        consentAt: { type: string, format: date-time }
    SuccessExportFilter:
      type: object
      additionalProperties: false
      properties:
        districtId: { type: string, format: uuid }
        customerType: { $ref: "#/components/schemas/CustomerType" }
        attitude: { $ref: "#/components/schemas/CustomerAttitude" }
        successOpportunityName: { type: string, minLength: 2, maxLength: 100 }
        customerContact: { type: string, maxLength: 200 }
        closedFrom: { type: string, format: date-time }
        closedTo: { type: string, format: date-time }
    WorkflowExportFilter:
      type: object
      additionalProperties: false
      properties:
        {
          districtId: { type: string, format: uuid },
          state: { $ref: "#/components/schemas/OpportunityState" },
          submittedFrom: { type: string, format: date-time },
          submittedTo: { type: string, format: date-time },
        }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [phone, displayName, initialPassword, grants]
      properties:
        phone: { type: string, pattern: '^1[3-9]\d{9}$' }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        initialPassword: { type: string, minLength: 6, maxLength: 12 }
        grants:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/CreateRoleGrantRequest" }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        active: { type: boolean }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [initialPassword]
      properties:
        initialPassword: { type: string, minLength: 6, maxLength: 12 }
    UpdateDistrictRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    CreateRoleGrantRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        {
          role: { $ref: "#/components/schemas/RoleCode" },
          districtId: { type: string, format: uuid },
        }
    PersonnelImportRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: { type: string, format: binary }
        mode: { type: string, enum: [UPSERT, SNAPSHOT], default: UPSERT }
        dryRun: { type: boolean, default: false }
        createAccounts: { type: boolean, default: false }
        initialPassword: { type: string, minLength: 6, maxLength: 12 }
        provisionSystemAdminCount:
          { type: integer, minimum: 0, maximum: 20, default: 0 }
        provisionSystemAdminPhone: { type: string, pattern: '^1[3-9]\d{9}$' }
    Personnel:
      type: object
      required:
        [
          id,
          personnelCode,
          name,
          sourceProfile,
          recommendedRoles,
          active,
          userId,
          lastSyncedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        personnelCode: { type: string }
        name: { type: string }
        personalPhone: { type: [string, "null"] }
        workPhone: { type: [string, "null"] }
        organizationPath: { type: [string, "null"] }
        firstLevelOrganization: { type: [string, "null"] }
        secondLevelOrganization: { type: [string, "null"] }
        thirdLevelOrganization: { type: [string, "null"] }
        positionName: { type: [string, "null"] }
        businessLine: { type: [string, "null"] }
        positionCategory: { type: [string, "null"] }
        standardPosition: { type: [string, "null"] }
        positionTags: { type: [string, "null"] }
        employmentStatus: { type: [string, "null"] }
        personnelType: { type: [string, "null"] }
        cooperativeEnterprise: { type: [string, "null"] }
        sourceProfile: { type: string, enum: [FULL_DIRECTORY, CONTACT_ONLY] }
        recommendedRoles:
          {
            type: array,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/RoleCode" },
          }
        active: { type: boolean }
        userId: { type: [string, "null"], format: uuid }
        lastSyncedAt: { type: string, format: date-time }
    PersonnelPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/Personnel" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PersonnelImport:
      type: object
      required:
        [
          id,
          fileName,
          mode,
          status,
          sourceProfile,
          totalRows,
          createdRows,
          updatedRows,
          deactivatedRows,
          skippedRows,
          accountsCreated,
          accountsLinked,
          warnings,
          createdAt,
          completedAt,
        ]
      properties:
        id: { type: string }
        fileName: { type: string }
        mode: { type: string, enum: [UPSERT, SNAPSHOT] }
        status: { type: string, enum: [PREVIEW, APPLIED, FAILED] }
        sourceProfile: { type: string, enum: [FULL_DIRECTORY, CONTACT_ONLY] }
        totalRows: { type: integer }
        createdRows: { type: integer }
        updatedRows: { type: integer }
        deactivatedRows: { type: integer }
        skippedRows: { type: integer }
        accountsCreated: { type: integer }
        accountsLinked: { type: integer }
        warnings: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    PersonnelAccountRequest:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        passwordMode:
          {
            type: string,
            enum: [PHONE_LAST_6, EXPLICIT],
            default: PHONE_LAST_6,
          }
        initialPassword: { type: string, minLength: 6, maxLength: 12 }
        grants:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CreateRoleGrantRequest" }
    PersonnelPositionRequest:
      type: object
      additionalProperties: false
      required: [code, name, roles]
      properties:
        code: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, minLength: 1, maxLength: 120 }
        roles:
          {
            type: array,
            maxItems: 7,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/RoleCode" },
          }
    PersonnelPositionUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
        roles:
          {
            type: array,
            maxItems: 7,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/RoleCode" },
          }
    PersonnelPosition:
      type: object
      required: [id, code, name, enabled, roles]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        roles:
          {
            type: array,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/RoleCode" },
          }
    RetentionRequest:
      type: object
      additionalProperties: false
      required: [action, confirmationSerialNumber]
      properties:
        {
          action: { type: string, enum: [ANONYMIZE, DELETE] },
          confirmationSerialNumber:
            { type: string, minLength: 1, maxLength: 32 },
        }
    ProblemDetails:
      type: object
      required: [type, title, status, detail, errorCode]
      properties:
        {
          type: { type: string, format: uri },
          title: { type: string },
          status: { type: integer },
          detail: { type: string },
          instance: { type: string },
          errorCode: { type: string },
          traceId: { type: [string, "null"] },
        }
